<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PyinNyar · Safari responsive QA</title>
<style>*{box-sizing:border-box}body{font:14px/1.6 system-ui;margin:0;background:#e5e8df;color:#173f35}header{padding:15px 24px;background:#173f35;color:white;position:sticky;top:0;z-index:99}button,select{font:inherit;padding:6px 12px;margin:4px}#status{font-weight:600}#stage{padding:20px;overflow:auto}iframe{border:0;outline:1px solid #b9c5b3;background:#f8f7f1;display:block;transform-origin:top left}#frame-wrap{margin:auto;position:relative}#report{margin:20px 24px;white-space:pre-wrap;font:12px/1.7 monospace}label{margin-right:15px}</style>
<header><strong>PyinNyar / Safari QA — local only</strong> <span id="status">Ready</span><br><button id="run">Run 18 layouts + flow checks</button><label>Language <select id="lang"><option value="zh">中文</option><option value="my">မြန်မာ</option><option value="en">English</option></select></label><label>Page <select id="page"><option value="index">Home</option><option value="match">Match</option></select></label><label>Viewport <select id="width"><option>375</option><option>768</option><option>1440</option></select></label><button id="show">Show</button><button id="entry">Show selected score inputs</button><span id="view-label"></span></header>
<div id="stage"><div id="frame-wrap"><iframe id="view" title="Responsive website preview"></iframe></div></div><pre id="report"></pre>
<script type="module">
const frame=document.querySelector('#view'),status=document.querySelector('#status'),out=document.querySelector('#report');
const all=[];let running=false;
const pause=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(condition,message)=>{if(!condition)throw Error(message)};
const BASE='__BASE_PATH__';const prefix=l=>BASE+l+'/';
function size(width){frame.style.width=width+'px';frame.style.height='900px';const scale=Math.min(1,(innerWidth-48)/width);frame.style.transform=`scale(${scale})`;document.querySelector('#frame-wrap').style.width=(width*scale)+'px';document.querySelector('#frame-wrap').style.height=(900*scale)+'px';}
async function ready(predicate,timeout=15000){const start=Date.now();while(!predicate()){if(Date.now()-start>timeout)throw Error('Timed out waiting for interactive page');await pause(60);}}
async function open(lang,page,width){size(width);frame.src=prefix(lang)+(page==='index'?'':page+'/');await ready(()=>frame.contentDocument?.readyState!=='loading'&&frame.contentDocument?.documentElement.lang===(lang==='zh'?'zh-CN':lang)&&frame.contentDocument?.querySelector(page==='match'?'#wizard-next':'.home-country-card'));await frame.contentDocument.fonts.ready;await pause(120);return frame.contentDocument;}
const overlap=(a,b)=>a.left<b.right-.5&&a.right>b.left+.5&&a.top<b.bottom-.5&&a.bottom>b.top+.5;
function metrics(d,label,width){const w=d.defaultView,root=d.documentElement,issues=[];const actual=w.innerWidth;
 if(actual!==width)issues.push('Expected width '+width+', actual '+actual);
 if(root.scrollWidth>actual+1)issues.push('Horizontal overflow '+root.scrollWidth+' > '+actual);
 const float=d.querySelector('.messenger-float'),f=float.getBoundingClientRect();
 if(f.right>actual+1||f.left<0||f.bottom>w.innerHeight+1)issues.push('Floating contact outside viewport');
 const interactive=[...d.querySelectorAll('main a,main button,main input,main select,footer a,footer button')].filter(e=>e.getClientRects().length&&w.getComputedStyle(e).visibility!=='hidden');
 const covered=interactive.filter(e=>overlap(e.getBoundingClientRect(),f));if(covered.length)issues.push('Contact covers '+covered.map(e=>e.textContent.slice(0,45)).join(','));
 const clipped=[...d.querySelectorAll('h1,h2,h3,.eyebrow,.qualification-option,.languages button,.messenger-cta')].filter(e=>e.getClientRects().length&&((e.scrollWidth>e.clientWidth+2&&w.getComputedStyle(e).overflowX!=='visible')||(e.scrollHeight>e.clientHeight+2&&['hidden','clip'].includes(w.getComputedStyle(e).overflowY))));if(clipped.length)issues.push('Clipped labels: '+clipped.map(e=>e.textContent.slice(0,40)).join(','));
 const messenger=[...d.querySelectorAll('[data-consult]')];if(!messenger.length||messenger.some(a=>a.tagName!=='A'||a.href!=='https://m.me/1353286931204662'||a.target!=='_blank'||!a.rel.split(' ').includes('noopener')||!a.querySelector('[data-messenger-icon]')))issues.push('Invalid Messenger CTA');
 if(d.querySelectorAll('.messenger-float').length!==1||d.querySelector('.consult-dock,#consultation'))issues.push('Duplicate contact UI');
 if(d.querySelector('header .brand-mark').getAttribute('src')!==BASE+'assets/favicon.svg')issues.push('Inconsistent logo');
 if(width>=1024){if(w.getComputedStyle(d.querySelector('.nav')).display==='none'||w.getComputedStyle(d.querySelector('.menu-toggle')).display!=='none')issues.push('Desktop navigation not flat');}
 else if(w.getComputedStyle(d.querySelector('.menu-toggle')).display==='none')issues.push('Mobile menu missing');
 const font=w.getComputedStyle(d.querySelector('.languages [lang=my]')).fontFamily;if(!font.includes('Myanmar'))issues.push('Myanmar language selector missing font');
 const result={label,width:actual,scrollWidth:root.scrollWidth,messengerLinks:messenger.length,myanmarSelectorFont:font,issues};all.push(result);out.textContent=JSON.stringify(all,null,2);return result;
}
function click(d,selector){const e=d.querySelector(selector);assert(e,'Missing '+selector);e.click();return e;}
function input(d,selector,value){const e=d.querySelector(selector);assert(e,'Missing input '+selector);e.value=value;e.dispatchEvent(new d.defaultView.Event('input',{bubbles:true}));e.dispatchEvent(new d.defaultView.Event('change',{bubbles:true}));}
async function homeChecks(d,lang,width){assert(d.querySelectorAll('.faqs details').length===8,'Expected 8 FAQ');assert(!d.querySelector('#student-cases'),'Empty case section visible');assert(d.querySelectorAll('.home-country-card li').length===12,'Expected 3 facts per country');for(const type of ['my','zh','alevel','ged']){click(d,`[data-background="${type}"]`);await pause(90);assert(d.querySelector(`[data-path="${type}"]`).getAttribute('aria-selected')==='true','Path strip fails '+type);}
 click(d,'[data-lang="my"]');await pause(60);assert(d.querySelector('[data-t=heroEyebrow]').textContent.match(/[\u1000-\u109f]/),'Home Burmese copy not updated');click(d,`[data-lang="${lang}"]`);await pause(60);d.defaultView.scrollTo(0,0);await pause(100);metrics(d,lang+' home '+width,width);
 d.querySelector('#contact').scrollIntoView();await pause(60);metrics(d,lang+' home footer '+width,width);}
async function matchChecks(d,lang,width){click(d,'#wizard-next');assert(!d.querySelector('#selection-error').hidden,'Missing selection feedback');
 for(const type of ['matriculation','chineseSchool','ged','alevel','hsk','ielts','csca','sat','act','ap','universityYears','competitions'])click(d,`[data-evidence="${type}"]`);
 click(d,'#wizard-next');await pause(60);assert(d.querySelectorAll('[data-acad]').length===4,'Selected academics missing');assert(d.querySelector('[data-model="hsk.level"]')&&d.querySelector('[data-model="ielts.overall"]'),'Selected language input missing');metrics(d,lang+' match all inputs '+width,width);
 input(d,'[data-acad="ged"] [data-sfield="score"]','160');click(d,'[data-lang="my"]');await pause(50);assert(d.querySelector('[data-acad="ged"] [data-sfield="score"]').value==='160','Score lost on language switch');click(d,`[data-lang="${lang}"]`);await pause(50);
 click(d,'[data-add-competition]');input(d,'[data-cfield=name]','QA synthetic activity');click(d,'[data-add-ap]');input(d,'[data-apfield=name]','QA Mathematics');input(d,'[data-apfield=score]','4');click(d,'#wizard-back');await pause(60);
 for(const type of ['matriculation','chineseSchool','alevel','hsk','ielts','csca','sat','act','ap','universityYears','competitions'])click(d,`[data-evidence="${type}"]`);
 click(d,'#wizard-next');await pause(60);assert(d.querySelectorAll('[data-acad]').length===1&&d.querySelector('[data-acad=ged]'),'Unselected academic input rendered');assert(!d.querySelector('[data-model="hsk.level"],[data-model="ielts.overall"],[data-competition],[data-ap]'),'Unselected evidence visible');
 const scores=d.querySelectorAll('[data-acad=ged] [data-sfield=score]');for(let i=0;i<4;i++){scores[i].value='160';scores[i].dispatchEvent(new d.defaultView.Event('input',{bubbles:true}));}click(d,'[data-acad=ged] [data-field=completed]');input(d,'[data-acad=ged] [data-field=year]','2026');
 d.querySelector('.more-tools').open=true;click(d,'#save-profile');await pause(60);const stored=JSON.parse(d.defaultView.localStorage.getItem('pyinnyar-profile-v1'));assert(stored.academics.length===1&&stored.academics[0].type==='ged','Save contains unchecked qualification');assert(!stored.hsk.level&&!stored.competitions.length&&!stored.extra.ap.length,'Save contains unchecked evidence');
 let exportUrl='';const intercept=event=>{const a=event.target.closest('a[download]');if(a){event.preventDefault();exportUrl=a.href;}};d.addEventListener('click',intercept,true);click(d,'#export-profile');d.removeEventListener('click',intercept,true);assert(exportUrl.startsWith('blob:'),'Export did not create a local file');const exported=await (await fetch(exportUrl)).json();assert(exported.academics.length===1&&exported.academics[0].subjects[0].score==='160','Export lost scores');assert(!exported.extra.ap.length&&!exported.competitions.length,'Export included unchecked evidence');
 d.querySelector('.more-tools').open=false;d.querySelector('#profile-form').requestSubmit();await pause(80);assert(d.querySelector('.result-consultation a')?.href==='https://m.me/1353286931204662','Result CTA missing');assert(d.querySelector('[aria-current=step] b').textContent===d.querySelectorAll('.wizard-progress b')[2].textContent,'Progress not on result step');metrics(d,lang+' match result '+width,width);
 click(d,'#edit-scores');await pause(50);assert(d.querySelector('[data-acad=ged] [data-sfield=score]').value==='160','Score lost when returning from results');
 // Import restores the selection step with the saved profile's evidence selected.
 d.querySelector('.more-tools').open=true;const transfer=new d.defaultView.DataTransfer();transfer.items.add(new d.defaultView.File([JSON.stringify(exported)],'qa-profile.json',{type:'application/json'}));const fileInput=d.querySelector('#profile-file');fileInput.files=transfer.files;fileInput.dispatchEvent(new d.defaultView.Event('change',{bubbles:true}));await ready(()=>frame.contentDocument.querySelector('#wizard-next'));d=frame.contentDocument;assert(d.querySelector('[data-evidence=ged]').checked,'Import did not restore GED choice');assert(!d.querySelector('[data-evidence=ielts]').checked,'Import selected absent IELTS');click(d,'#wizard-next');await pause(50);assert(d.querySelector('[data-acad=ged] [data-sfield=score]').value==='160','Import did not restore scores');
 // Clear only the synthetic profile created by this harness; this port has isolated storage.
 d.defaultView.localStorage.removeItem('pyinnyar-profile-v1');d.defaultView.scrollTo(0,0);
}
async function run(){if(running)return;running=true;all.length=0;document.querySelector('#run').disabled=true;const meta={browser:navigator.userAgent,startedAt:new Date().toISOString()};
 for(const width of [375,768,1440])for(const lang of ['zh','my','en'])for(const page of ['index','match']){status.textContent=`Checking ${lang} ${page} ${width}px`;try{const d=await open(lang,page,width);metrics(d,lang+' '+page+' initial '+width,width);if(page==='index')await homeChecks(d,lang,width);else await matchChecks(d,lang,width);}catch(error){all.push({label:`${lang} ${page} ${width}`,issues:[String(error)]});out.textContent=JSON.stringify(all,null,2);}}
 status.textContent='Checking delayed module loading';try{size(375);frame.src='/__qa/slow-match';await ready(()=>frame.contentDocument?.querySelector('.match-loading'));await pause(700);const d=frame.contentDocument;assert(d.defaultView.getComputedStyle(d.querySelector('#page')).display==='none','Static fallback flashed');assert(d.defaultView.getComputedStyle(d.querySelector('.match-loading')).display!=='none','No visible loader');all.push({label:'Delayed module: fallback hidden and skeleton visible',issues:[]});await ready(()=>frame.contentDocument.querySelector('#wizard-next'));}catch(error){all.push({label:'Delayed module loader',issues:[String(error)]});}
 const failed=all.filter(r=>r.issues.length).length;const report={...meta,finishedAt:new Date().toISOString(),failed,checks:all};await fetch('/__qa/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});out.textContent=JSON.stringify(report,null,2);status.textContent=`Complete: ${all.length} checks, ${failed} failures`;document.querySelector('#run').disabled=false;running=false;}
async function show(){const l=document.querySelector('#lang').value,p=document.querySelector('#page').value,w=Number(document.querySelector('#width').value);await open(l,p,w);status.textContent=`Preview ${l} ${p} ${w}px`;document.querySelector('#view-label').textContent=`actual ${frame.contentWindow.innerWidth}px, scroll ${frame.contentDocument.documentElement.scrollWidth}px`;}
document.querySelector('#run').onclick=run;document.querySelector('#show').onclick=show;document.querySelector('#entry').onclick=()=>{const d=frame.contentDocument;if(d.querySelector('#wizard-next')){for(const type of ['alevel','ged','hsk','ielts','competitions'])if(!d.querySelector(`[data-evidence="${type}"]`).checked)click(d,`[data-evidence="${type}"]`);click(d,'#wizard-next');d.defaultView.scrollTo(0,0);}};
const opts=new URLSearchParams(location.search);for(const key of ['lang','page','width'])if(opts.has(key))document.querySelector('#'+key).value=opts.get(key);if(opts.has('run'))run();else show();
</script></html>
